name: Mobile App CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint 검사
        run: npm run lint

      - name: TypeScript 타입 체크
        run: npm run type-check

      - name: 빌드 검증 (웹 번들링)
        run: npx expo export --platform web
